# Cloudflare Worker for Khaleej Rozgar (free plan: 100k requests/day, D1 5M reads + 100k writes/day).
#   /found  POST  a phone reports jobs it found itself -> checked -> pushed to FCM topics -> saved for the feed
#   /finds  GET   the hourly feed builder collects phone finds (needs x-feed-key)
#   /seen   GET   ids already pushed (?ids=a,b)
# Deploy: npx wrangler login ; npx wrangler d1 create khaleej-rozgar ; put the id below ;
#         npx wrangler d1 execute khaleej-rozgar --remote --file=schema.sql ;
#         npx wrangler secret put FIREBASE_SERVICE_ACCOUNT ; npx wrangler secret put FEED_KEY ; npx wrangler deploy
name = "khaleej-rozgar"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_NUMBER = "18725941989"   # App Check: project number of the Khaleej Rozgar Firebase project
REQUIRE_APP_CHECK = "false"  # turn to "true" once App Check (Play Integrity) is registered after the Play listing

[[d1_databases]]
binding = "DB"
database_name = "khaleej-rozgar"
database_id = "4bc1dc30-80f5-4deb-81b9-ca2b2ba2b659"
